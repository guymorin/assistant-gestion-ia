[client]
# Masque les outils developpeur de Streamlit (Deploy, Rerun, Clear cache)
# tout en conservant les options spectateur (theme, impression, a propos).
toolbarMode = "viewer"

[server]
# Évite la saturation inotify (overflow) en excluant les répertoires volumineux/non-code.
folderWatchBlacklist = [".venv", "venv", ".git", "__pycache__", "chroma_db", "Finances", "Finances-TVA", "Ingestion", "RH-Onboarding", "logs", "uploads", "pieces_jointes", "exports", "backups"]

# Palette alignée sur les tokens --green / --paper / --ink
[theme]
primaryColor = "#2C5B29"
backgroundColor = "#F6F2EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2421"
font = "sans serif"

[theme.light]
primaryColor = "#2C5B29"
backgroundColor = "#F6F2EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2421"

[theme.dark]
primaryColor = "#2C5B29"
backgroundColor = "#1F2421"
secondaryBackgroundColor = "#2A302C"
textColor = "#F6F2EA"
